name: Deploy Pipeline

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment used by build, publish and deploy jobs
        type: string
        required: true
      deploy:
        description: Whether to run the deployment job on the self-hosted runner
        type: boolean
        required: false
        default: false
      deployRunner:
        description: Self-hosted runner label for the target environment (e.g. develop, staging)
        type: string
        required: false
        default: ''
      deployScript:
        description: Deployment script executed on the self-hosted runner
        type: string
        required: false
        default: ''
      publishLatest:
        description: Also tag the published images with latest
        type: boolean
        required: false
        default: false
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint all projects
        run: npx nx run-many -t lint

      - name: Test all projects
        run: npx nx run-many -t test

      - name: Build all apps
        run: npx nx run-many -t build --configuration=production

  build-images:
    name: Build and publish ${{ inputs.environment }} images
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all apps with Nx
        run: npx nx run-many -t build --configuration=production

      - name: Upload dist build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-apps
          path: dist/apps/

  publish-docker:
    needs: build-images
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    strategy:
      matrix:
        app: [liquidacion, novedades]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download dist build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-apps
          path: dist/apps/

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/um.haberes.${{ matrix.app }}-client
          tags: |
            type=raw,value=${{ github.sha }}
            ${{ inputs.publishLatest && 'latest' || '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    name: Deploy ${{ inputs.environment }} services
    needs: publish-docker
    if: github.event_name == 'push' && inputs.deploy
    runs-on: [self-hosted, linux, "${{ inputs.deployRunner }}"]
    environment:
      name: ${{ inputs.environment }}
    permissions:
      contents: read

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Deploy haberes frontend clients
        run: ${{ inputs.deployScript }} "${GITHUB_SHA}"

name: Deploy develop

on:
  pull_request:
    branches: ["develop"]
  push:
    branches: ["develop"]

concurrency:
  group: deploy-develop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pipeline:
    uses: ./.github/workflows/deploy-pipeline.yml
    with:
      environment: develop
      deploy: true
      deployRunner: develop
      deployScript: /kibaig0ahNgashee/infraestructura/um/env-develop/deploy-haberes-frontend-develop.sh
    permissions:
      contents: read
      packages: write
    secrets: inherit

@if (isOpen) {
  <div class="relative z-[9999]" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-black/60 transition-opacity"></div>

    <!-- Contenedor de centrado: captura clics/ESC para cerrar -->
    <div
      tabindex="-1"
      class="fixed inset-0 z-10 w-screen overflow-y-auto"
      (click)="cerrarModal()"
      (keydown.escape)="cerrarModal()"
    >
      <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
        <!-- Panel del formulario: detiene propagación de clics -->
        <div
          tabindex="-1"
          (click)="$event.stopPropagation()"
          (keydown)="$event.stopPropagation()"
          class="relative transform flex max-h-[90vh] flex-col overflow-hidden rounded-lg border border-um-border bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg"
        >
          <!-- Header -->
          <div
            class="flex shrink-0 items-center justify-between border-b border-um-border bg-white px-4 py-4 sm:px-6"
          >
            <h3 class="text-lg font-bold leading-6 text-um-ink" id="modal-title">Cambiar Clave</h3>
            <button
              type="button"
              (click)="cerrarModal()"
              class="rounded-md text-um-muted hover:text-um-ink focus:outline-none"
            >
              <span class="sr-only">Cerrar</span>
              <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M6 18L18 6M6 6l12 12"
                />
              </svg>
            </button>
          </div>

          <!-- Body / Form -->
          <form
            [formGroup]="form"
            (ngSubmit)="onSubmit()"
            class="flex flex-1 flex-col overflow-hidden"
          >
            <div class="flex-1 space-y-4 overflow-y-auto bg-white px-4 py-5 sm:p-6">
              @if (errorMessage) {
                <div class="um-alert um-alert-error rounded-md" role="alert">
                  <p class="text-sm font-medium">{{ errorMessage }}</p>
                </div>
              }

              @if (successMessage) {
                <div class="um-alert um-alert-success rounded-md" role="status">
                  <p class="text-sm font-medium">{{ successMessage }}</p>
                </div>
              }

              <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                <!-- Legajo (locked) -->
                <div>
                  <label for="legajo" class="um-label">Legajo</label>
                  <input
                    id="legajo"
                    type="text"
                    formControlName="legajoId"
                    readonly
                    class="um-input mt-1 cursor-not-allowed bg-um-canvas text-um-muted"
                  />
                </div>

                <!-- Nombre (locked: en Haberes vive en la vista de persona) -->
                <div>
                  <label for="nombre" class="um-label">Nombre</label>
                  <input
                    id="nombre"
                    type="text"
                    formControlName="nombre"
                    readonly
                    class="um-input mt-1 cursor-not-allowed bg-um-canvas text-um-muted"
                  />
                </div>
              </div>

              <div>
                <label for="claveAnterior" class="um-label">Clave Anterior</label>
                <input
                  id="claveAnterior"
                  type="password"
                  formControlName="currentPassword"
                  autocomplete="current-password"
                  class="um-input mt-1"
                />
              </div>

              <div>
                <label for="claveNueva" class="um-label">Clave Nueva</label>
                <input
                  id="claveNueva"
                  type="password"
                  formControlName="newPassword"
                  autocomplete="new-password"
                  class="um-input mt-1"
                />
              </div>

              <div>
                <label for="reClaveNueva" class="um-label">Re - Clave</label>
                <input
                  id="reClaveNueva"
                  type="password"
                  formControlName="reClaveNueva"
                  autocomplete="new-password"
                  class="um-input mt-1"
                />
              </div>
            </div>

            <!-- Footer -->
            <div
              class="flex shrink-0 gap-2 border-t border-um-border bg-um-surface px-4 py-3 sm:flex-row-reverse sm:px-6"
            >
              <button type="submit" [disabled]="isLoading" class="um-btn-primary w-full sm:w-auto">
                @if (isLoading) {
                  <span>Procesando...</span>
                } @else {
                  <span>Cambiar Clave</span>
                }
              </button>
              <button
                type="button"
                (click)="cerrarModal()"
                [disabled]="isLoading"
                class="um-btn-secondary mt-3 w-full sm:mt-0 sm:w-auto"
              >
                Salir
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
}

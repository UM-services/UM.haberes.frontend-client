
<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <img class="mx-auto h-24 w-auto object-contain" src="/logo.png" alt="Universidad de Mendoza">
    <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
      Acceso a Haberes
    </h2>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label for="legajoId" class="block text-sm font-medium text-gray-700">
            Legajo
          </label>
          <div class="mt-1">
            <input id="legajoId" formControlName="legajoId" type="text" (blur)="onLegajoBlur()" required
                   class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
          </div>
          @if (apellidoNombre()) {
            <div class="mt-2 text-sm font-bold text-blue-800">
              {{ apellidoNombre() }}
            </div>
          }
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">
            Password
          </label>
          <div class="mt-1">
            <input id="password" formControlName="password" type="password" required
                   class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
          </div>
        </div>

        @if (isFirstTime()) {
          <div>
            <label for="rePassword" class="block text-sm font-medium text-gray-700">
              Repetir Password
            </label>
            <div class="mt-1">
              <input id="rePassword" formControlName="rePassword" type="password"
                     class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>
          </div>
        }

        @if (errorMessage()) {
          <div class="p-2 bg-red-50 border border-red-200 rounded text-red-700 text-xs font-medium">
            {{ errorMessage() }}
          </div>
        }

        <div>
          <button type="submit" [disabled]="loginForm.invalid"
                  class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:bg-gray-400">
            Ingresar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="flex min-h-screen items-center justify-center bg-um-canvas px-4 py-12">
  <div class="w-full max-w-md">
    <div class="mb-8 text-center">
      <div class="inline-flex items-center justify-center mb-4">
        <img class="h-16 w-auto object-contain rounded-md" src="/logo.png" alt="Universidad de Mendoza">
      </div>
      <p class="um-eyebrow">Haberes</p>
      <h1 class="um-page-title text-center">UM Haberes</h1>
      <p class="um-page-desc">Portal Institucional de Gestión Docente y Liquidaciones</p>
    </div>

    <div class="rounded-lg border border-um-border bg-white p-8 shadow-sm">
      @if (errorMessage()) {
        <div class="um-alert um-alert-error mb-6" role="alert">
          {{ errorMessage() }}
        </div>
      }

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
        <div>
          <label for="legajoId" class="um-label">N° de Legajo</label>
          <input
            id="legajoId"
            formControlName="legajoId"
            type="text"
            (blur)="onLegajoBlur()"
            required
            placeholder="Ingrese su legajo..."
            class="um-input"
            [ngClass]="{
              'um-input-invalid':
                loginForm.get('legajoId')?.invalid && loginForm.get('legajoId')?.touched
            }"
          />
          @if (apellidoNombre()) {
            <div class="mt-2 inline-flex items-center gap-1.5 px-3 py-1 rounded bg-um-selected border border-um-btn-border text-um-primary text-xs font-semibold">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 shrink-0 text-um-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
              <span>{{ apellidoNombre() }}</span>
            </div>
          }
        </div>

        <div>
          <label for="password" class="um-label">Contraseña</label>
          <input
            id="password"
            formControlName="password"
            type="password"
            required
            placeholder="••••••••"
            class="um-input"
            [ngClass]="{
              'um-input-invalid':
                loginForm.get('password')?.invalid && loginForm.get('password')?.touched
            }"
          />
        </div>

        @if (isFirstTime()) {
          <div class="p-3 bg-amber-50 border border-amber-200 rounded">
            <label for="rePassword" class="um-label text-amber-900">
              Confirmar Contraseña (Primer Ingreso)
            </label>
            <input
              id="rePassword"
              formControlName="rePassword"
              type="password"
              placeholder="Repetir contraseña..."
              class="um-input"
              [ngClass]="{
                'um-input-invalid':
                  loginForm.get('rePassword')?.invalid && loginForm.get('rePassword')?.touched
              }"
            />
          </div>
        }

        <div class="pt-2">
          <button
            type="submit"
            [disabled]="loginForm.invalid"
            class="um-btn-primary w-full"
          >
            Ingresar al Sistema
          </button>
        </div>
      </form>
    </div>

    <p class="mt-6 text-center text-xs text-um-muted">
      Universidad de Mendoza &bull; Sistema de Haberes
    </p>
  </div>
</div>

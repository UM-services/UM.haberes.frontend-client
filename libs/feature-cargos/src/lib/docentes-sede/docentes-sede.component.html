<div class="flex flex-col gap-4 max-w-4xl mx-auto mt-6">
  
  <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-sm flex flex-col gap-8">
    
    <div>
      <h2 class="text-2xl font-bold text-gray-800 tracking-tight">Docentes por Sede</h2>
      <p class="text-gray-500 mt-1 text-sm">Genere un reporte en PDF de los docentes asignados a la facultad, filtrado por sede geográfica y período.</p>
    </div>

    <div class="flex flex-col md:flex-row gap-6 items-start">
      
      <!-- Selector de Sede -->
      <div class="flex-1 w-full">
        <label class="block text-xs uppercase font-bold text-gray-500 mb-2">Sede (Geográfica)</label>
        <div class="relative">
          <select [ngModel]="sedeSeleccionada()" (ngModelChange)="sedeSeleccionada.set($event)"
                  [disabled]="isLoadingSedes()"
                  class="w-full pl-4 pr-10 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all sm:text-sm shadow-sm appearance-none bg-white disabled:bg-gray-100 disabled:text-gray-500">
            <option [ngValue]="null" disabled selected>-- Seleccione una sede --</option>
            <option *ngFor="let sede of sedes()" [ngValue]="sede.geograficaId">
              {{ sede.nombre }}
            </option>
          </select>
          <div class="absolute right-3 top-3.5 pointer-events-none text-gray-400">
            <svg *ngIf="!isLoadingSedes()" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
            <div *ngIf="isLoadingSedes()" class="animate-spin h-5 w-5 border-2 border-gray-400 border-t-transparent rounded-full"></div>
          </div>
        </div>
      </div>

      <!-- Fecha -->
      <div class="flex gap-3 items-center">
        <div>
          <label class="block text-xs uppercase font-bold text-gray-500 mb-2">Mes</label>
          <input type="number" [ngModel]="mes()" (ngModelChange)="mes.set($event)" class="w-20 px-3 py-3 border border-gray-300 rounded-xl text-center shadow-sm">
        </div>
        <div>
          <label class="block text-xs uppercase font-bold text-gray-500 mb-2">Año</label>
          <input type="number" [ngModel]="anho()" (ngModelChange)="anho.set($event)" class="w-24 px-3 py-3 border border-gray-300 rounded-xl text-center shadow-sm">
        </div>
        <div class="flex flex-col gap-1 mt-6">
          <div class="flex gap-1 bg-gray-100 p-1 rounded-xl border border-gray-200">
            <button (click)="cambiarMes(-1)" class="p-2 bg-white rounded-lg shadow-sm hover:bg-blue-50 hover:text-blue-600 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" /></svg>
            </button>
            <button (click)="cambiarMes(1)" class="p-2 bg-white rounded-lg shadow-sm hover:bg-blue-50 hover:text-blue-600 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" /></svg>
            </button>
          </div>
        </div>
      </div>

    </div>

    <!-- Actions -->
    <div class="border-t border-gray-100 pt-6 mt-2 flex justify-end">
      <button (click)="descargar()" 
              [disabled]="!sedeSeleccionada() || isDownloading() || isLoadingSedes()"
              class="px-8 py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 shadow-md shadow-blue-200 transition-all flex items-center gap-3 disabled:opacity-50 disabled:cursor-not-allowed group">
        
        <div *ngIf="isDownloading()" class="animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"></div>
        <svg *ngIf="!isDownloading()" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transform group-hover:-translate-y-0.5 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
        
        <span>{{ isDownloading() ? 'Generando PDF...' : 'Descargar Reporte' }}</span>
      </button>
    </div>

  </div>
</div>
